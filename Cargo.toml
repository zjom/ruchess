[package]
name = "ruchess"
version = "0.0.12"
edition = "2024"
authors = ["zjom"]
license = "Unlicense"
description = "rust chess"
documentation = "https://docs.rs/ruchess"
repository = "https://github.com/zjom/ruchess"

[dependencies]
arrayvec = "0.7.6"

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["html_reports", "cargo_bench_support"] }
proptest = "1"

[workspace]
members = ["tui"]

[profile.bench]
inherits = "release"
debug = true

[[bench]]
name = "perft"
harness = false
